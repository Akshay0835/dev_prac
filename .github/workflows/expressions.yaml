name: Using Expressions
run-name: Using Expressions | DEBUG -${{inputs.debug&&'ON'||'OFF'}}

on:
    workflow_dispatch:
        inputs:
            debug:
                type: boolean
                default: false

jobs:
    echo:
        runs-on: ubuntu-latest
        steps:
            - name: '[Debug] Print start-up date'
              if: inputs.debug
              run: |
                echo "Debug is ON"
                echo "Workflow name: ${{github.workflow}}"
                echo "run id: ${{github.run_id}}"
                echo "Run number : ${{github.run_number}}"
                echo "Event name: ${{github.event_name}}"
                echo "Actor : ${{github.actor}}"
                echo "Repository : ${{github.repository}}"
                echo "Branch : ${{github.ref_name}}"
                echo "SHA : ${{github.sha}}"
            - name: '[Debug] Print when triggerd from main'
              if: inputs.debug && github.ref_name == 'main'
              run: |
                  echo "This workflow was triggered from the main branch"
            - name: Greeting
              run: |
                  echo "Hello, ${{github.actor}}! Welcome to the Using Expression workflow."